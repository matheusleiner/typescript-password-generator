<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Password generator.">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Password Generator</title>
</head>
<body>
    <main>
        <img src="icon.png" alt="Padlock" style="width: 50px; height: 50px; margin: 0 auto;">
        <h1>
            Password Generator
        </h1>
        <output>
            <span>
                ...
            </span>
            <button>
                <i class="fa-regular fa-copy fa-lg" style="color: black"></i>
            </button>
        </output>
        <form>
            <div>
                <label for="passwordLength">
                    Password Length
                </label>
                <div id="passwordLengthDiv">
                    <span id="passwordLengthSpan">
                        12
                    </span>
                    <span>
                        /99
                    </span>
                </div>
            </div>
            <input type="range" name="passwordLength" id="passwordLength" min="8" max="99" value="12">

            <div>
                <label for="lowerCase">Lower Case Letters</label>
                <label class="switch" aria-label="Enable lower case letters">
                    <input type="checkbox" name="lowerCase" id="lowerCase" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div>
                <label for="upperCase">Upper Case Letters</label>
                <label class="switch" aria-label="Enable upper case letters">
                    <input type="checkbox" name="upperCase" id="upperCase" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div>
                <label for="numbers">Numbers</label>
                <label class="switch" aria-label="Enable numbers">
                    <input type="checkbox" name="numbers" id="numbers" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div>
                <label for="symbols">Symbols</label>
                <label class="switch" aria-label="Enable symbols">
                    <input type="checkbox" name="symbols" id="symbols" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <button type="submit">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>
                    GENERATE
                </span>
            </button>
        </form>
    </main>
    <script src="./dist/script.js"></script>
</body>
</html>
